<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CSC Integration Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#07080a;
  --bg-elev:#111217;
  --bg-elev-2:#17181e;
  --border:#26272d;
  --border-soft:#1c1d22;
  --yellow:#f4c10f;
  --yellow-soft:#ffe07a;
  --orange:#e8752d;
  --cream:#f3ecc7;
  --text:#f5f5f1;
  --text-dim:#96969c;
  --text-dim-2:#5b5c62;
  --danger:#e8574a;
  --success:#5fc383;
  --font-display:'Chakra Petch','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-body:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  min-height:100vh;
}
[dir="rtl"] body{font-family:var(--font-body);}
::selection{background:var(--yellow);color:#0a0a0a;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
textarea,input{font-family:inherit;}

/* focus visibility */
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--yellow);
  outline-offset:2px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
}

/* ============ LAYOUT SHELLS ============ */
#app{min-height:100vh; position:relative; width:100%;}
.screen{min-height:100vh; width:100%; display:flex; flex-direction:column;}
.wrap{width:100%; max-width:860px; margin:0 auto; padding:0 24px;}
.wrap-wide{width:100%; max-width:1180px; margin:0 auto; padding:0 24px;}

/* background texture: faint grid + glow, no external images */
.bg-field{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 620px 420px at 18% -6%, rgba(244,193,15,0.10), transparent 60%),
    radial-gradient(ellipse 520px 420px at 100% 8%, rgba(232,117,45,0.08), transparent 55%),
    linear-gradient(var(--bg), var(--bg));
}
.bg-field::before{
  content:"";
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(244,193,15,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(244,193,15,0.035) 1px, transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, black 30%, transparent 78%);
}

/* ============ CLIP-CORNER SYSTEM (brand geometry, echoes the logo's cut letterforms) ============ */
.cut{clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);}
.cut-rev{clip-path:polygon(0 16px, 16px 0, 100% 0, 100% 100%, 0 100%);}
.cut-sm{clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);}
.cut-both{clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));}

/* ============ LOGO ============ */
.logo-img{display:block; height:34px; width:auto; filter:drop-shadow(0 0 14px rgba(244,193,15,0.18));}
.logo-img.lg{height:76px;}
.logo-img.xl{height:104px;}

/* ============ TOP HUD ============ */
.hud{
  position:sticky; top:0; z-index:40;
  background:rgba(7,8,10,0.82);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
}
.hud-inner{
  max-width:1180px; margin:0 auto; padding:14px 24px;
  display:flex; align-items:center; gap:18px;
}
.hud-player{display:flex; flex-direction:column; gap:2px; margin-inline-start:6px;}
.hud-name{font-family:var(--font-display); font-size:13px; letter-spacing:0.04em; color:var(--text);}
.hud-level{font-size:11px; color:var(--text-dim); letter-spacing:0.06em;}
.hud-spacer{flex:1;}
.hud-xp{display:flex; flex-direction:column; gap:6px; width:180px;}
.hud-xp-label{font-size:10px; color:var(--text-dim); letter-spacing:0.08em; display:flex; justify-content:space-between;}
.xp-track{height:6px; background:var(--bg-elev-2); border:1px solid var(--border); position:relative; overflow:hidden;}
.xp-fill{height:100%; background:linear-gradient(90deg, var(--orange), var(--yellow)); transition:width 900ms cubic-bezier(.2,.8,.2,1); box-shadow:0 0 12px rgba(244,193,15,0.45);}
.lang-switch{display:flex; gap:4px; margin-inline-start:14px;}
.lang-btn{
  background:transparent; border:1px solid var(--border); color:var(--text-dim);
  font-size:11px; padding:6px 9px; letter-spacing:0.04em;
}
.lang-btn.active{border-color:var(--yellow); color:var(--yellow); background:rgba(244,193,15,0.08);}

/* ============ BUTTONS ============ */
.btn{
  font-family:var(--font-display);
  font-weight:600;
  font-size:14px;
  letter-spacing:0.04em;
  padding:15px 30px;
  border:none;
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  transition:transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
}
.btn-primary{
  background:linear-gradient(90deg, var(--yellow), var(--yellow-soft));
  color:#141008;
  box-shadow:0 0 0 1px rgba(244,193,15,0.2), 0 14px 34px -12px rgba(244,193,15,0.55);
}
.btn-primary:hover{transform:translateY(-2px); box-shadow:0 0 0 1px rgba(244,193,15,0.35), 0 18px 40px -10px rgba(244,193,15,0.65);}
.btn-primary:disabled{opacity:0.35; cursor:not-allowed; transform:none; box-shadow:none;}
.btn-ghost{
  background:transparent; color:var(--text); border:1px solid var(--border);
}
.btn-ghost:hover{border-color:var(--text-dim); background:rgba(255,255,255,0.03);}
.btn-sm{padding:10px 18px; font-size:12px;}

/* ============ WELCOME ============ */
.welcome-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative; z-index:1; padding:60px 24px;}
.welcome-inner{text-align:center; max-width:640px; margin:0 auto;}
.welcome-kicker{
  font-size:11px; letter-spacing:0.22em; color:var(--text-dim); margin-bottom:34px;
  display:flex; align-items:center; justify-content:center; gap:12px;
}
.welcome-kicker .line{width:28px; height:1px; background:var(--border);}
.welcome-title{
  font-family:var(--font-display); font-weight:700;
  font-size:clamp(34px, 6.4vw, 58px);
  line-height:1.04; letter-spacing:0.01em;
  margin:0 0 18px;
  background:linear-gradient(180deg, #fff 30%, var(--yellow-soft) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.welcome-subtitle{font-size:19px; color:var(--text); margin:0 0 10px; font-weight:500;}
.welcome-tagline{font-size:14px; color:var(--text-dim); margin:0 0 46px;}
.welcome-cta-row{display:flex; justify-content:center; margin-bottom:52px;}
.lang-choice-label{font-size:11px; letter-spacing:0.12em; color:var(--text-dim-2); margin-bottom:16px;}
.lang-grid{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
.lang-card{
  background:var(--bg-elev); border:1px solid var(--border);
  padding:12px 20px; display:flex; align-items:center; gap:10px;
  font-size:14px; color:var(--text-dim); transition:all 160ms ease;
}
.lang-card .flag{font-size:17px;}
.lang-card:hover{border-color:var(--yellow); color:var(--text);}
.lang-card.selected{border-color:var(--yellow); color:var(--yellow); background:rgba(244,193,15,0.07);}
.welcome-logo-wrap{margin-bottom:30px; display:flex; justify-content:center;}

/* ============ MAP ============ */
.map-screen{padding:44px 0 90px; position:relative; z-index:1;}
.map-head{text-align:center; margin-bottom:56px;}
.map-title{font-family:var(--font-display); font-size:clamp(26px,4.4vw,38px); font-weight:700; margin:0 0 10px; letter-spacing:0.01em;}
.map-sub{color:var(--text-dim); font-size:14px; margin:0;}
.map-path{position:relative; max-width:640px; margin:0 auto; padding-left:0;}
.map-node{
  position:relative; display:flex; align-items:flex-start; gap:20px;
  padding-bottom:38px;
}
.map-node:last-child{padding-bottom:0;}
.map-node-line{
  position:absolute; left:27px; top:56px; bottom:-38px; width:2px;
  background:repeating-linear-gradient(var(--border) 0 6px, transparent 6px 12px);
}
.map-node:last-child .map-node-line{display:none;}
.map-node.unlocked .map-node-line{background:repeating-linear-gradient(rgba(244,193,15,0.55) 0 6px, transparent 6px 12px);}
.map-node-badge{
  flex-shrink:0; width:56px; height:56px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:18px;
  background:var(--bg-elev); border:1px solid var(--border); color:var(--text-dim-2);
  position:relative; z-index:1;
}
.map-node.completed .map-node-badge{background:linear-gradient(135deg,var(--orange),var(--yellow)); color:#141008; border-color:transparent;}
.map-node.unlocked .map-node-badge{border-color:var(--yellow); color:var(--yellow); box-shadow:0 0 0 4px rgba(244,193,15,0.08);}
.map-node-card{
  flex:1; background:var(--bg-elev); border:1px solid var(--border);
  padding:18px 20px; transition:border-color 160ms ease, transform 160ms ease;
}
.map-node.unlocked .map-node-card, .map-node.completed .map-node-card{cursor:pointer;}
.map-node.unlocked .map-node-card:hover, .map-node.completed .map-node-card:hover{border-color:var(--yellow); transform:translateX(4px);}
[dir="rtl"] .map-node.unlocked .map-node-card:hover, [dir="rtl"] .map-node.completed .map-node-card:hover{transform:translateX(-4px);}
.map-node-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px;}
.map-node-name{font-family:var(--font-display); font-weight:600; font-size:15px; letter-spacing:0.02em;}
.map-node.locked .map-node-name{color:var(--text-dim-2);}
.map-node-xp{font-size:11px; color:var(--yellow); font-weight:600; white-space:nowrap;}
.map-node.locked .map-node-xp{color:var(--text-dim-2);}
.map-node-desc{font-size:13px; color:var(--text-dim); margin:0 0 12px; line-height:1.5;}
.map-node.locked .map-node-desc{color:var(--text-dim-2);}
.map-node-status{font-size:11px; letter-spacing:0.06em; display:flex; align-items:center; gap:6px;}
.status-dot{width:6px; height:6px; border-radius:50%; background:var(--text-dim-2);}
.map-node.completed .status-dot{background:var(--success);}
.map-node.unlocked .status-dot{background:var(--yellow);}
.map-node.completed .map-node-status{color:var(--success);}
.map-node.unlocked .map-node-status{color:var(--yellow);}
.map-node.locked .map-node-status{color:var(--text-dim-2);}

/* ============ LEVEL PAGES ============ */
.level-screen{flex:1; display:flex; align-items:center; justify-content:center; padding:56px 24px 80px; position:relative; z-index:1;}
.level-inner{width:100%; max-width:680px;}
.level-eyebrow{font-size:11px; letter-spacing:0.14em; color:var(--yellow); margin-bottom:14px; display:flex; align-items:center; gap:10px;}
.level-title{font-family:var(--font-display); font-size:clamp(24px,4vw,34px); font-weight:700; margin:0 0 40px; letter-spacing:0.01em;}
.field-block{margin-bottom:36px;}
.field-q{font-size:15px; font-weight:600; margin-bottom:16px; color:var(--text);}
.text-input{
  width:100%; background:var(--bg-elev); border:1px solid var(--border); color:var(--text);
  padding:15px 16px; font-size:15px; transition:border-color 160ms ease;
}
.text-input:focus{border-color:var(--yellow);}
.text-input::placeholder{color:var(--text-dim-2);}
textarea.text-input{resize:vertical; min-height:100px; line-height:1.5;}

.choice-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
.choice-card{
  background:var(--bg-elev); border:1px solid var(--border); padding:16px 14px;
  font-size:14px; color:var(--text-dim); text-align:center; transition:all 140ms ease;
}
.choice-card:hover{border-color:var(--text-dim);}
.choice-card.selected{border-color:var(--yellow); color:var(--yellow); background:rgba(244,193,15,0.07); box-shadow:inset 0 0 0 1px rgba(244,193,15,0.2);}

.char-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;}
.char-card{
  background:var(--bg-elev); border:1px solid var(--border); padding:20px; text-align:left; transition:all 140ms ease;
}
[dir="rtl"] .char-card{text-align:right;}
.char-card:hover{border-color:var(--text-dim); transform:translateY(-2px);}
.char-card.selected{border-color:var(--yellow); background:rgba(244,193,15,0.06); transform:translateY(-2px); box-shadow:0 12px 26px -14px rgba(244,193,15,0.5);}
.char-icon{font-size:26px; margin-bottom:10px; display:block;}
.char-name{font-family:var(--font-display); font-weight:600; font-size:14px; letter-spacing:0.02em; margin-bottom:5px;}
.char-desc{font-size:12.5px; color:var(--text-dim); line-height:1.4;}

.skill-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:32px;}
.skill-chip{
  background:var(--bg-elev); border:1px solid var(--border); padding:13px 10px; text-align:center;
  font-size:13px; color:var(--text-dim); transition:all 140ms ease; display:flex; align-items:center; justify-content:center; gap:8px;
}
.skill-chip:hover{border-color:var(--text-dim);}
.skill-chip.selected{border-color:var(--yellow); color:var(--yellow); background:rgba(244,193,15,0.08);}

.icebreak-card{
  background:var(--bg-elev); border:1px solid var(--border); padding:32px 28px; margin-bottom:28px; position:relative; overflow:hidden;
}
.icebreak-tag{font-size:11px; color:var(--orange); letter-spacing:0.1em; margin-bottom:14px;}
.icebreak-q{font-family:var(--font-display); font-size:19px; font-weight:600; line-height:1.4;}
.icebreak-q.spin{animation:qspin 420ms ease;}
@keyframes qspin{0%{opacity:0; transform:translateY(6px);}100%{opacity:1; transform:translateY(0);}}

.level-actions{display:flex; justify-content:space-between; align-items:center; margin-top:36px; gap:14px;}
.level-hint{font-size:12px; color:var(--text-dim-2);}

/* ============ FINAL / CELEBRATION ============ */
.final-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative; z-index:1; padding:60px 24px; text-align:center;}
.final-trophy{font-size:52px; margin-bottom:22px; display:inline-block; animation:trophyIn 700ms cubic-bezier(.2,1.4,.4,1);}
@keyframes trophyIn{0%{transform:scale(0) rotate(-20deg); opacity:0;}100%{transform:scale(1) rotate(0); opacity:1;}}
.final-kicker{font-size:12px; letter-spacing:0.2em; color:var(--yellow); margin-bottom:18px;}
.final-title{font-family:var(--font-display); font-weight:700; font-size:clamp(28px,5vw,42px); margin:0 0 14px;}
.final-sub{color:var(--text-dim); font-size:14px; letter-spacing:0.05em; margin-bottom:40px;}
#confetti-canvas{position:fixed; inset:0; z-index:30; pointer-events:none;}

/* ============ PROFILE CARD ============ */
.profile-screen{padding:70px 24px 90px; position:relative; z-index:1;}
.profile-card{
  max-width:460px; margin:0 auto; background:var(--bg-elev);
  border:1px solid var(--border); padding:0; position:relative;
}
.profile-band{
  background:linear-gradient(120deg, #17140a, #0d0b06);
  padding:26px 26px 22px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.profile-badge-pill{font-size:10px; letter-spacing:0.1em; color:var(--yellow); border:1px solid rgba(244,193,15,0.4); padding:5px 10px;}
.profile-body{padding:28px 26px 26px;}
.profile-name{font-family:var(--font-display); font-size:26px; font-weight:700; margin:0 0 4px;}
.profile-role{color:var(--yellow); font-size:13px; letter-spacing:0.04em; margin-bottom:22px;}
.profile-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:22px;}
.profile-stat-label{font-size:10px; color:var(--text-dim-2); letter-spacing:0.09em; margin-bottom:4px;}
.profile-stat-val{font-size:14px; color:var(--text);}
.profile-skills{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:24px;}
.profile-skill-tag{font-size:11px; border:1px solid var(--border); padding:5px 10px; color:var(--text-dim);}
.profile-xp-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.profile-xp-num{font-family:var(--font-display); font-size:15px; color:var(--yellow); font-weight:700;}
.profile-footer{display:flex; gap:10px; margin-top:26px;}
.profile-completion-ring{
  width:52px; height:52px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--yellow);
  background:conic-gradient(var(--yellow) calc(var(--pct,100) * 1%), var(--bg-elev-2) 0);
  position:relative;
}
.profile-completion-ring::before{content:""; position:absolute; inset:4px; border-radius:50%; background:var(--bg-elev);}
.profile-completion-ring span{position:relative; z-index:1;}
.profile-below-actions{max-width:460px; margin:22px auto 0; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

/* ============ ADMIN ============ */
.admin-screen{position:relative; z-index:1; padding:0 0 90px;}
.admin-top{
  border-bottom:1px solid var(--border-soft); padding:28px 0;
  background:rgba(17,18,23,0.5);
}
.admin-top-inner{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;}
.admin-title{font-family:var(--font-display); font-size:24px; font-weight:700; margin:0 0 4px;}
.admin-sub{color:var(--text-dim); font-size:13px; margin:0;}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:26px 0 32px;}
.stat-card{background:var(--bg-elev); border:1px solid var(--border); padding:18px 20px;}
.stat-num{font-family:var(--font-display); font-size:28px; font-weight:700; color:var(--yellow); margin-bottom:4px;}
.stat-label{font-size:11px; color:var(--text-dim); letter-spacing:0.06em;}
.admin-controls{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
.admin-search{
  flex:1; min-width:200px; background:var(--bg-elev); border:1px solid var(--border); color:var(--text);
  padding:11px 14px; font-size:13px;
}
.admin-select{background:var(--bg-elev); border:1px solid var(--border); color:var(--text-dim); padding:11px 12px; font-size:12px;}
.admin-table-wrap{overflow-x:auto; border:1px solid var(--border); margin-bottom:44px;}
table.admin-table{width:100%; border-collapse:collapse; font-size:13px; min-width:760px;}
.admin-table th{
  text-align:left; padding:12px 16px; font-size:10.5px; letter-spacing:0.07em; color:var(--text-dim-2);
  background:var(--bg-elev); border-bottom:1px solid var(--border); white-space:nowrap;
}
[dir="rtl"] .admin-table th{text-align:right;}
.admin-table td{padding:13px 16px; border-bottom:1px solid var(--border-soft); color:var(--text-dim); white-space:nowrap;}
.admin-table tr:last-child td{border-bottom:none;}
.admin-table tr:hover td{background:rgba(255,255,255,0.015); color:var(--text);}
.pill{font-size:10.5px; padding:4px 9px; display:inline-block; letter-spacing:0.03em;}
.pill-completed{background:rgba(95,195,131,0.12); color:var(--success); border:1px solid rgba(95,195,131,0.3);}
.pill-progress{background:rgba(244,193,15,0.1); color:var(--yellow); border:1px solid rgba(244,193,15,0.3);}
.pill-new{background:rgba(150,150,156,0.08); color:var(--text-dim); border:1px solid var(--border);}
.admin-empty{padding:40px; text-align:center; color:var(--text-dim-2); font-size:13px;}
.charts-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.chart-card{background:var(--bg-elev); border:1px solid var(--border); padding:18px 18px 8px;}
.chart-card h4{font-family:var(--font-display); font-size:12.5px; font-weight:600; margin:0 0 14px; letter-spacing:0.03em; color:var(--text);}
.chart-card.wide{grid-column:span 2;}
.chart-holder{position:relative; height:190px;}
.admin-footer-link{margin-top:36px; text-align:center;}

/* ============ FOOT NAV within levels ============ */
.top-strip{padding:20px 0 0;}
.back-link{font-size:12px; color:var(--text-dim); display:inline-flex; align-items:center; gap:6px; background:none; border:none; padding:6px 0;}
.back-link:hover{color:var(--yellow);}

/* ============ RESPONSIVE ============ */
@media (max-width:760px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .charts-grid{grid-template-columns:1fr;}
  .chart-card.wide{grid-column:span 1;}
  .hud-xp{width:110px;}
  .hud-name{font-size:11.5px;}
  .profile-grid{grid-template-columns:1fr 1fr;}
}
@media (max-width:520px){

}

var SEED_CHARS = ["strategist","creator","builder","speaker","teamplayer","explorer"];
var SEED_SKILLS = ["dev","ai","data","design","speak","social","video","solve","team","marketing"];

function seedStudents(){
  var out = [];
  var now = Date.now();
  for(var i=0;i<SEED_NAMES.length;i++){
    var n = SEED_NAMES[i];
    var levelIdx = i % 6; // 0..5, 5 = fully completed
    var completed = levelIdx >= 4;
    var xpSteps = [0,100,250,450,700,1000];
    var daysAgo = Math.floor(Math.random()*30)+1;
    var joined = new Date(now - daysAgo*86400000);
    var skillCount = 2 + (i % 4);
    var shuffledSkills = SEED_SKILLS.slice().sort(function(){return Math.random()-0.5;}).slice(0, skillCount);
    out.push({
      id:"seed-"+i,
      name:n[0], field:n[1], year:n[2], language:n[3],
      levelIndex: Math.min(levelIdx,4),
      xp: xpSteps[levelIdx],
      completed: completed,
      character: SEED_CHARS[i % SEED_CHARS.length],
      skills: shuffledSkills,
      badge: completed ? "CSC EXPLORER" : "",
      createdAt: joined.toISOString(),
      isSeed:true
    });
  }
  return out;
}

var DB_KEY = "csc_quest_students_v1";
var PLAYER_KEY = "csc_quest_player_v1";

function loadDB(){
  try{
    var raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];
}
function saveDB(list){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(list)); }catch(e){}
}
async function refreshDBFromApi(){
  try{
    var response = await fetch("/api/students");
    if(!response.ok) throw new Error("Failed to fetch students");
    var students = await response.json();
    saveDB(Array.isArray(students) ? students : []);
    try{ window.dispatchEvent(new CustomEvent("csc:db-update")); }catch(e){}
    return students;
  }catch(e){
    console.error("Unable to load students from API", e);
    return loadDB();
  }
}
async function upsertStudent(student){
  try{
    var response = await fetch("/api/students", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(student)
    });
    var payload = await response.json().catch(function(){ return {}; });
    if(!response.ok) {
      throw new Error(payload.error || "Student save failed");
    }
    await refreshDBFromApi();
    return payload;
  }catch(e){
    console.error("Unable to save student through API", e);
    var db = loadDB();
    var idx = -1;
    for(var i=0;i<db.length;i++){ if(db[i].id === student.id){ idx = i; break; } }
    if(idx >= 0) db[idx] = student; else db.push(student);
    saveDB(db);
    try{ window.dispatchEvent(new CustomEvent("csc:db-update")); }catch(err){}
    return { success: false, error: String(e) };
  }
}

function esc(s){

    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];

}

function levelState(i){

  if(STATE.player.levelIndex === i) return "unlocked";

}
function renderMap(){
  var d = t().map;
  var nodes = d.levels.map(function(lvl, i){
    var st = levelState(i);
    var statusLabel = st==="completed" ? d.done : st==="unlocked" ? d.inprogress : d.locked;
    var badgeContent = st==="completed" ? "✓" : (i===4 ? "🏆" : String(i));
    return (
      '<div class="map-node '+st+'" '+(st!=="locked" ? 'data-action="golevel" data-idx="'+i+'"' : '')+'>' +
        '<div class="map-node-line"></div>' +

        '<div class="map-node-card">' +

          '<div class="map-node-status"><span class="status-dot"></span>'+statusLabel+'</div>' +
        '</div>' +
      '</div>'
    );
  }).join('');
  return (
    '<div class="screen map-screen fade-in">' +
      hud() +
      '<div class="wrap">' +
        '<div class="map-head" style="margin-top:40px;">' +
          '<h2 class="map-title">'+d.title+'</h2>' +

        '</div>' +
        '<div class="map-path">'+nodes+'</div>' +
      '</div>' +
    '</div>'
  );
}

  var idx = SEED_CHARS.indexOf(key);

}

=================================================================== */
var charts = {};
function destroyCharts(){
  Object.keys(charts).forEach(function(k){ if(charts[k]) charts[k].destroy(); });
  charts = {};
}

function filteredStudents(db){
  var f = STATE.admin;
  db = db || loadDB();
  return db.filter(function(s){
    if(f.search && s.name.toLowerCase().indexOf(f.search.toLowerCase()) === -1) return false;
    if(f.field !== "all" && s.field !== f.field) return false;
    if(f.year !== "all" && s.year !== f.year) return false;
    if(f.lang !== "all" && s.language !== f.lang) return false;
    if(f.level !== "all" && String(s.levelIndex) !== f.level) return false;
    if(f.status !== "all"){
      var st = s.completed ? "completed" : (s.levelIndex>0 ? "progress" : "new");
      if(st !== f.status) return false;
    }
    return true;
  });
}

function statusPill(s){
  var d = t().admin;
  if(s.completed) return '<span class="pill pill-completed">'+d.statusCompleted+'</span>';
  if(s.levelIndex>0) return '<span class="pill pill-progress">'+d.statusProgress+'</span>';
  return '<span class="pill pill-new">'+d.statusNew+'</span>';
}

  var d = t().admin;
  all = all || loadDB();

  var completed = all.filter(function(s){return s.completed;}).length;
  var inprogress = all.filter(function(s){return !s.completed && s.levelIndex>0;}).length;

    var dt = new Date(s.createdAt); var now = new Date();

  var list = filteredStudents(all);
  var fieldOptions = Array.from(new Set(all.map(function(s){return s.field;})));

        '<div class="hud-spacer"></div>' +
        '<span class="pill pill-progress" style="display:flex;align-items:center;gap:6px;"><span class="status-dot" style="background:var(--yellow);"></span>'+d.live+'</span>' +
        langSwitcherHUD() +
      '</div></div>' +
      '<div class="admin-top"><div class="wrap-wide admin-top-inner">' +
        '<div><h2 class="admin-title">'+d.title+'</h2><p class="admin-sub">'+d.subtitle+'</p></div>' +
        '<button class="btn btn-ghost btn-sm cut-sm" data-action="gomap">'+d.backToQuest+'</button>' +
      '</div></div>' +
      '<div class="wrap-wide">' +
        '<div class="stat-grid">' +
          '<div class="stat-card"><div class="stat-num">'+total+'</div><div class="stat-label">'+d.total+'</div></div>' +
          '<div class="stat-card"><div class="stat-num">'+completed+'</div><div class="stat-label">'+d.completed+'</div></div>' +
          '<div class="stat-card"><div class="stat-num">'+inprogress+'</div><div class="stat-label">'+d.inprogress+'</div></div>' +
          '<div class="stat-card"><div class="stat-num">'+today+'</div><div class="stat-label">'+d.today+'</div></div>' +
        '</div>' +
        '<div class="admin-controls">' +
          '<input class="admin-search" type="text" placeholder="'+d.search+'" value="'+esc(STATE.admin.search)+'" data-action="adminsearch">' +
          '<select class="admin-select" data-action="adminfield">' +
            '<option value="all">'+d.allFields+'</option>' +
            fieldOptions.map(function(f){return '<option value="'+esc(f)+'" '+(STATE.admin.field===f?'selected':'')+'>'+esc(f)+'</option>';}).join('') +
          '</select>' +
          '<select class="admin-select" data-action="adminyear">' +
            '<option value="all">'+d.allYears+'</option>' +
            yearOptions.map(function(y){return '<option value="'+esc(y)+'" '+(STATE.admin.year===y?'selected':'')+'>'+esc(y)+'</option>';}).join('') +
          '</select>' +
          '<select class="admin-select" data-action="adminlang">' +
            '<option value="all">'+d.allLang+'</option>' +
            '<option value="fr" '+(STATE.admin.lang==="fr"?'selected':'')+'>FR</option>' +
            '<option value="en" '+(STATE.admin.lang==="en"?'selected':'')+'>EN</option>' +
            '<option value="ar" '+(STATE.admin.lang==="ar"?'selected':'')+'>AR</option>' +
          '</select>' +

            '<option value="completed" '+(STATE.admin.status==="completed"?'selected':'')+'>'+d.statusCompleted+'</option>' +
            '<option value="progress" '+(STATE.admin.status==="progress"?'selected':'')+'>'+d.statusProgress+'</option>' +

          '<div class="chart-card"><h4>'+d.byLanguage+'</h4><div class="chart-holder"><canvas id="chart-lang"></canvas></div></div>' +
          '<div class="chart-card"><h4>'+d.byField+'</h4><div class="chart-holder"><canvas id="chart-field"></canvas></div></div>' +
          '<div class="chart-card"><h4>'+d.completionRate+'</h4><div class="chart-holder"><canvas id="chart-completion"></canvas></div></div>' +

          '<div class="chart-card"><h4>'+d.topCharacter+'</h4><div class="chart-holder"><canvas id="chart-char"></canvas></div></div>' +
          '<div class="chart-card wide" style="grid-column:span 3;"><h4>'+d.topSkills+'</h4><div class="chart-holder"><canvas id="chart-skills"></canvas></div></div>' +

function mountAdminCharts(){
  if(typeof Chart === "undefined") return;
  destroyCharts();
  var all = loadDB();
  var d = t().admin;
  Chart.defaults.color = "#96969c";
  Chart.defaults.font.family = "'Inter', sans-serif";
  Chart.defaults.font.size = 11;
  var yellow = "#f4c10f", orange = "#e8752d", cream = "#f3ecc7", grid = "rgba(255,255,255,0.06)";

  // language
  var langCounts = {fr:0,en:0,ar:0};
  all.forEach(function(s){ if(langCounts[s.language] !== undefined) langCounts[s.language]++; });
  charts.lang = new Chart(document.getElementById("chart-lang"), {
    type:"doughnut",
    data:{ labels:["FR","EN","AR"], datasets:[{ data:[langCounts.fr,langCounts.en,langCounts.ar], backgroundColor:[orange,yellow,cream], borderColor:"#111217", borderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:"bottom", labels:{boxWidth:10,padding:12}}} }
  });

  // field
  var fieldCounts = {};
  all.forEach(function(s){ fieldCounts[s.field] = (fieldCounts[s.field]||0)+1; });
  var fieldLabels = Object.keys(fieldCounts);
  charts.field = new Chart(document.getElementById("chart-field"), {
    type:"bar",
    data:{ labels:fieldLabels, datasets:[{ data:fieldLabels.map(function(k){return fieldCounts[k];}), backgroundColor:yellow, borderRadius:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, indexAxis:"y", plugins:{legend:{display:false}}, scales:{x:{grid:{color:grid}, ticks:{precision:0}}, y:{grid:{display:false}}} }
  });

  // completion rate
  var completed = all.filter(function(s){return s.completed;}).length;
  var notCompleted = all.length - completed;
  charts.completion = new Chart(document.getElementById("chart-completion"), {
    type:"doughnut",
    data:{ labels:[d.statusCompleted, "Other"], datasets:[{ data:[completed, notCompleted], backgroundColor:[yellow,"#26272d"], borderColor:"#111217", borderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:"70%", plugins:{legend:{position:"bottom", labels:{boxWidth:10,padding:12}}} }
  });

  // by level
  var levelCounts = [0,0,0,0,0];
  all.forEach(function(s){ levelCounts[Math.min(s.levelIndex,4)]++; });
  charts.level = new Chart(document.getElementById("chart-level"), {
    type:"bar",
    data:{ labels:["Lvl 0","Lvl 1","Lvl 2","Lvl 3","Lvl 4"], datasets:[{ data:levelCounts, backgroundColor:orange, borderRadius:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{grid:{color:grid}, ticks:{precision:0}}, x:{grid:{display:false}}} }
  });

  // top character
  var charCounts = {};
  SEED_CHARS.forEach(function(c){ charCounts[c]=0; });
  all.forEach(function(s){ if(s.character) charCounts[s.character] = (charCounts[s.character]||0)+1; });
  charts.char = new Chart(document.getElementById("chart-char"), {
    type:"polarArea",
    data:{ labels:SEED_CHARS.map(charLabel), datasets:[{ data:SEED_CHARS.map(function(c){return charCounts[c];}), backgroundColor:[yellow,orange,cream,"#c98f3b","#8a6a1f","#d9a441"] }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{r:{grid:{color:grid}, ticks:{display:false}}} }
  });

  // top skills
  var skillCounts = {};
  SEED_SKILLS.forEach(function(s){ skillCounts[s]=0; });
  all.forEach(function(s){ (s.skills||[]).forEach(function(sk){ skillCounts[sk] = (skillCounts[sk]||0)+1; }); });
  charts.skills = new Chart(document.getElementById("chart-skills"), {
    type:"bar",
    data:{ labels:SEED_SKILLS.map(skillLabel), datasets:[{ data:SEED_SKILLS.map(function(k){return skillCounts[k];}), backgroundColor:yellow, borderRadius:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{grid:{color:grid}, ticks:{precision:0}}, x:{grid:{display:false}, ticks:{autoSkip:false, maxRotation:30, minRotation:0}}} }
  });
}

/* ===================================================================
   CONFETTI
=================================================================== */
function fireConfetti(){
  var canvas = document.getElementById("confetti-canvas");
  var ctx = canvas.getContext("2d");
  var W = canvas.width = window.innerWidth;
  var H = canvas.height = window.innerHeight;
  var colors = ["#f4c10f","#ffe07a","#e8752d","#f3ecc7"];
  var pieces = [];
  for(var i=0;i<130;i++){
    pieces.push({
      x: Math.random()*W, y: -20 - Math.random()*H*0.5,
      w: 6+Math.random()*6, h: 4+Math.random()*8,
      color: colors[Math.floor(Math.random()*colors.length)],
      speedY: 2+Math.random()*3.5, speedX: (Math.random()-0.5)*2.4,
      rot: Math.random()*360, rotSpeed:(Math.random()-0.5)*10
    });
  }
  var start = Date.now();
  function frame(){
    var elapsed = Date.now()-start;
    ctx.clearRect(0,0,W,H);
    pieces.forEach(function(p){
      p.y += p.speedY; p.x += p.speedX; p.rot += p.rotSpeed;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(elapsed < 3200){ requestAnimationFrame(frame); }
    else { ctx.clearRect(0,0,W,H); }
  }
  frame();
}

/* ===================================================================
   MAIN RENDER
=================================================================== */
function render(){
  document.documentElement.setAttribute("dir", t().dir);
  document.documentElement.setAttribute("lang", STATE.lang);
  var app = document.getElementById("app");
  var html = "";
  switch(STATE.screen){
    case "welcome": html = renderWelcome(); break;
    case "map": html = renderMap(); break;
    case "level0": html = renderLevel0(); break;
    case "level1": html = renderLevel1(); break;
    case "level2": html = renderLevel2(); break;
    case "level3": html = renderLevel3(); break;
    case "final": html = renderFinal(); break;
    case "profile": html = renderProfile(); break;
    case "admin": html = renderAdmin(); break;
    default: html = renderWelcome();
  }
  app.innerHTML = html;
  if(STATE.screen === "final") fireConfetti();
  if(STATE.screen === "admin") {
    refreshDBFromApi().then(function(students){
      if(STATE.screen !== "admin") return;
      app.innerHTML = renderAdmin(students);
      mountAdminCharts();
    });
  }
}

/* ===================================================================
   ACTIONS / EVENT DELEGATION
=================================================================== */
function persistProgress(){
  persist();
  upsertStudent({
    id: STATE.player.id,
    name: STATE.player.name || "New Explorer",
    field: STATE.player.field || "—",
    year: STATE.player.year || "—",
    language: STATE.lang,
    levelIndex: STATE.player.levelIndex,
    xp: STATE.player.xp,
    completed: STATE.player.completed,
    character: STATE.player.characters[0] || "",
    skills: STATE.player.skills,
    badge: STATE.player.badge,
    createdAt: STATE.player.createdAt
  });
}

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");
  var p = STATE.player;

  switch(action){
    case "setlang":
      STATE.lang = el.getAttribute("data-lang");
      p.language = STATE.lang;
      try{ localStorage.setItem("csc_quest_lang", STATE.lang); }catch(err){}
      persist();
      render();
      break;
    case "start":
      setScreen("map");
      break;
    case "gomap":
      setScreen("map");
      break;
    case "golevel":
      var idx = parseInt(el.getAttribute("data-idx"),10);
      if(idx > p.levelIndex) return;
      if(idx === 4 && !p.completed){
        p.completed = true; p.xp = 1000; p.badge = "CSC EXPLORER";
        persistProgress();
      }
      setScreen(LEVEL_KEY_ORDER[idx]);
      break;
    case "setfield":
      p.field = el.getAttribute("data-val"); persist(); render();
      break;
    case "setyear":
      p.year = el.getAttribute("data-val"); persist(); render();
      break;
    case "submit0":
      if(p.name.trim() && p.field && p.year){
        p.levelIndex = 1; p.xp += 100; persistProgress();
        showToast("+100 XP");
        setScreen("map");
      }
      break;
    case "togglechar":
      var cv = el.getAttribute("data-val");
      var ci = p.characters.indexOf(cv);
      if(ci>=0) p.characters.splice(ci,1); else p.characters.push(cv);
      persist(); render();
      break;
    case "submit1":
      if(p.characters.length){
        p.levelIndex = 2; p.xp += 150; persistProgress();
        showToast("+150 XP");
        setScreen("map");
      }
      break;
    case "toggleskill":
      var sv = el.getAttribute("data-val");
      var si = p.skills.indexOf(sv);
      if(si>=0) p.skills.splice(si,1); else p.skills.push(sv);
      persist(); render();
      break;
    case "submit2":
      if(p.skills.length){
        p.levelIndex = 3; p.xp += 200; persistProgress();
        showToast("+200 XP");
        setScreen("map");
      }
      break;
    case "submit3":
      if(p.icebreakerA.trim().length > 2){
        p.levelIndex = 4; p.xp += 250; persistProgress();
        showToast("+250 XP");
        setScreen("map");
      }
      break;
    case "viewprofile":
      setScreen("profile");
      break;
    case "restart":
      STATE.player = defaultPlayer();
      STATE.player.language = STATE.lang;
      persist();
      setScreen("welcome");
      break;
    case "download":
      showToast(STATE.lang==="fr" ? "Fais une capture d'écran de ta carte ✨" : STATE.lang==="ar" ? "التقط لقطة شاشة لبطاقتك ✨" : "Screenshot your card to save it ✨");
      break;
    case "adminsearch": break; // handled on input
    default: break;
  }
});

document.addEventListener("input", function(e){
  var el = e.target;
  var action = el.getAttribute("data-action");
  if(!action) return;
  var p = STATE.player;
  switch(action){
    case "setname":
      p.name = el.value; persist();
      var hudName = document.querySelector(".hud-name");
      if(hudName) hudName.textContent = p.name || "PLAYER";
      var submit0Btn = document.querySelector('[data-action="submit0"]');
      if(submit0Btn) submit0Btn.disabled = !(p.name.trim().length>0 && p.field && p.year);
      break;
    case "setcontribution":
      p.contribution = el.value; persist();
      break;
    case "setice":
      p.icebreakerA = el.value; persist();
      var btn = document.querySelector('[data-action="submit3"]');
      if(btn) btn.disabled = !(p.icebreakerA.trim().length > 2);
      break;
    case "adminsearch":
      STATE.admin.search = el.value; render();
      break;
  }
});

document.addEventListener("change", function(e){
  var el = e.target;
  var action = el.getAttribute("data-action");
  if(!action) return;
  switch(action){
    case "adminfield": STATE.admin.field = el.value; render(); break;
    case "adminyear": STATE.admin.year = el.value; render(); break;
    case "adminlang": STATE.admin.lang = el.value; render(); break;
    case "adminlevel": STATE.admin.level = el.value; render(); break;
    case "adminstatus": STATE.admin.status = el.value; render(); break;
  }
});
